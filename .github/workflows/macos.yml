name: Mac OS Build

on:
  push:
    branches: [ EMGUCV_5_x ]
  pull_request:
    branches: [ EMGUCV_5_x ]

jobs:
  build:

    # .NET 11's iOS / MacCatalyst bindings need Xcode 27, which only the xcode-27 image has.
    runs-on: xcode-27
    
    # one day time out
    timeout-minutes: 1440

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Select Xcode 27.2
      # The image defaults to an older Xcode 27; .NET 11's iOS pack is built for 27.2.
      run: sudo xcode-select -s /Applications/Xcode_27.2.app
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.x'
    - name: Install dotnet workload
      # Not pinned: the bare net11.0-ios / -maccatalyst TFM in newer workload sets needs a newer
      # Xcode than the runner may have (MT4162 / IL7000), but those sets still ship the older
      # bindings, which the explicit TFM from the next step selects.
      run: dotnet workload install maui maccatalyst
    - name: Select iOS / MacCatalyst TFM for the runner's Xcode
      run: |
        V="$(./platforms/macos/apple_tfm_version.sh)"
        echo "Xcode: $(xcodebuild -version | head -1); TFM platform version: '$V'"
        echo "IOS_TFM=net11.0-ios$V" >> "$GITHUB_ENV"
        echo "CATALYST_TFM=net11.0-maccatalyst$V" >> "$GITHUB_ENV"
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build Emgu CV native binary
      run: ./configure_arm64
      working-directory: ./platforms/macos/
    - name: Build Emgu CV package (unsigned)
      run: make package
      working-directory: ./platforms/macos/build_arm64/
    - uses: actions/upload-artifact@v7
      with:
        name: emgucv-macos-zip-package
        path: ${{ github.workspace }}/platforms/macos/build_arm64/*.zip
    - name: Run BuildInfo.Console demo
      run: dotnet run --project Emgu.CV.Example/BuildInfo.Console/BuildInfo.Console.csproj -p:EmguCVSkipMobileTargets=true
    - name: Build Emgu CV MacCatalyst native binary and package
      run: ./build_catalyst.sh arm64
      working-directory: ./platforms/ios/
    - uses: actions/upload-artifact@v7
      with:
        name: emgucv-maccatalyst-zip-package
        path: ${{ github.workspace }}/platforms/ios/catalyst_arm64/*.zip
    - name: Build MacCatalyst MAUI demo app
      run: dotnet build Emgu.CV.Example/MAUI/MauiDemoApp/MauiDemoApp.csproj -f "$CATALYST_TFM" -p:TargetFrameworks="$CATALYST_TFM" -p:ValidateXcodeVersion=false
    - name: Build Emgu CV iOS native binary
      run: ./build.sh simulator_arm64
      working-directory: ./platforms/ios/
    - name: Build iOS MAUI demo app for simulator
      run: dotnet build Emgu.CV.Example/MAUI/MauiDemoApp/MauiDemoApp.csproj -f "$IOS_TFM" -p:TargetFrameworks="$IOS_TFM" -p:ValidateXcodeVersion=false
    - name: Install Android NDK
      run: |
        NDK_VERSION="28.0.12916984"
        SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)"
        yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;$NDK_VERSION"
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - name: Ensure ninja is installed
      run: brew list ninja &>/dev/null || brew install ninja
    - name: Build Emgu CV Android arm64-v8a native binary and package
      run: ./build.sh arm64-v8a
      working-directory: ./platforms/android/scripts/
    - uses: actions/upload-artifact@v7
      with:
        name: emgucv-android-arm64-v8a-nuget-package
        path: ${{ github.workspace }}/platforms/nuget/*.nupkg
    - name: Build Android MAUI demo app
      run: dotnet build Emgu.CV.Example/MAUI/MauiDemoApp/MauiDemoApp.csproj -f net11.0-android